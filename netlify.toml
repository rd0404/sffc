[build]
  functions = "netlify/functions"

[functions."snapshot-gameweek-background"]
  schedule = "@hourly"

[[redirects]]
  from = "/api/gameweek"
  to = "/.netlify/functions/gameweek"
  status = 200

[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/progress"
  status = 200

[[redirects]]
  from = "/api/standings"
  to = "/.netlify/functions/standings"
  status = 200

[[redirects]]
  from = "/api/standings-live"
  to = "/.netlify/functions/standings-live"
  status = 200

[[redirects]]
  from = "/api/compare"
  to = "/.netlify/functions/compare"
  status = 200

[[redirects]]
  from = "/api/team-of-week"
  to = "/.netlify/functions/team-of-week"
  status = 200

[[redirects]]
  from = "/api/captain"
  to = "/.netlify/functions/captain"
  status = 200

[[redirects]]
  from = "/api/fixtures-list"
  to = "/.netlify/functions/fixtures-list"
  status = 200

[[redirects]]
  from = "/api/chip-usage"
  to = "/.netlify/functions/chip-usage"
  status = 200

[[redirects]]
  from = "/api/captain-count"
  to = "/.netlify/functions/captain-count"
  status = 200

[[redirects]]
  from = "/api/stats-records"
  to = "/.netlify/functions/stats-records"
  status = 200

[[redirects]]
  from = "/api/backfill-captains"
  to = "/.netlify/functions/backfill-captains"
  status = 200
